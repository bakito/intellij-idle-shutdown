<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- IntelliJ dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B2D30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E1F22;stop-opacity:1" />
    </linearGradient>

    <!-- Power button red gradient -->
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FE2857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC1E43;stop-opacity:1" />
    </linearGradient>

    <!-- Clock ring blue gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B9DFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D6DE0;stop-opacity:1" />
    </linearGradient>

    <!-- Terminal green gradient -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4EC94E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E9E2E;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background (IntelliJ plugin icon shape) -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="url(#bgGrad)" stroke="#3C3F41" stroke-width="1.5"/>

  <!-- Subtle inner border highlight -->
  <rect x="5" y="5" width="118" height="118" rx="19" ry="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- === MONITOR / IDE WINDOW === -->
  <rect x="22" y="28" width="84" height="58" rx="5" ry="5" fill="#1E1F22" stroke="#4E5157" stroke-width="2"/>

  <!-- IDE title bar -->
  <rect x="22" y="28" width="84" height="12" rx="5" ry="5" fill="#3C3F41"/>
  <rect x="22" y="35" width="84" height="5" fill="#3C3F41"/>

  <!-- Title bar dots (traffic lights) -->
  <circle cx="30" cy="34" r="2" fill="#FE2857"/>
  <circle cx="37" cy="34" r="2" fill="#FFBD2E"/>
  <circle cx="44" cy="34" r="2" fill="#4EC94E"/>

  <!-- === CODE EDITOR LINES === -->
  <!-- Line numbers area -->
  <rect x="27" y="44" width="10" height="36" rx="1" fill="#2B2D30" opacity="0.6"/>

  <!-- Code lines (representing source code) -->
  <g opacity="0.85">
    <!-- Line numbers -->
    <text x="31" y="52" font-family="'JetBrains Mono', monospace" font-size="5" fill="#6B6F76" text-anchor="middle">1</text>
    <text x="31" y="60" font-family="'JetBrains Mono', monospace" font-size="5" fill="#6B6F76" text-anchor="middle">2</text>
    <text x="31" y="68" font-family="'JetBrains Mono', monospace" font-size="5" fill="#6B6F76" text-anchor="middle">3</text>
    <text x="31" y="76" font-family="'JetBrains Mono', monospace" font-size="5" fill="#6B6F76" text-anchor="middle">4</text>

    <!-- Code content with syntax highlighting colors -->
    <rect x="42" y="47" width="18" height="3" rx="1" fill="#CF8E6D" opacity="0.9"/>  <!-- keyword (orange) -->
    <rect x="62" y="47" width="14" height="3" rx="1" fill="#6AAB73" opacity="0.9"/>  <!-- identifier (green) -->
    <rect x="42" y="55" width="12" height="3" rx="1" fill="#6B9DFC" opacity="0.9"/>  <!-- method (blue) -->
    <rect x="56" y="55" width="22" height="3" rx="1" fill="#BCBEC4" opacity="0.6"/>  <!-- params (gray) -->
    <rect x="44" y="63" width="20" height="3" rx="1" fill="#6AAB73" opacity="0.9"/>  <!-- value (green) -->
    <rect x="66" y="63" width="10" height="3" rx="1" fill="#CF8E6D" opacity="0.9"/>  <!-- closing (orange) -->
    <rect x="42" y="71" width="26" height="3" rx="1" fill="#6B9DFC" opacity="0.7"/>  <!-- comment (blue) -->
  </g>

  <!-- Cursor blink -->
  <rect x="42" y="71" width="1.5" height="4" fill="#A8C7FA" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- === MONITOR STAND === -->
  <rect x="55" y="86" width="18" height="6" rx="1" fill="#3C3F41"/>
  <rect x="48" y="92" width="32" height="3" rx="1.5" fill="#4E5157"/>

  <!-- === CLOCK (idle timer) === -->
  <circle cx="90" cy="72" r="18" fill="#1E1F22" stroke="url(#clockGrad)" stroke-width="2.5" opacity="0.95" filter="url(#glow)"/>

  <!-- Clock tick marks -->
  <g stroke="#6B9DFC" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="90" y1="58" x2="90" y2="61"/>
    <line x1="90" y1="83" x2="90" y2="86"/>
    <line x1="76" y1="72" x2="79" y2="72"/>
    <line x1="101" y1="72" x2="104" y2="72"/>
  </g>

  <!-- Clock hands -->
  <g stroke="#A8C7FA" stroke-width="1.8" stroke-linecap="round" fill="none">
    <line x1="90" y1="72" x2="90" y2="62"/>
    <line x1="90" y1="72" x2="99" y2="68"/>
  </g>
  <circle cx="90" cy="72" r="1.8" fill="#A8C7FA"/>

  <!-- === POWER BUTTON (IEC 60417-5009) === -->
  <g transform="translate(108, 26)" filter="url(#glow)">
    <!-- Arc with gap at top -->
    <path d="M 0,-8
             A 9,9 0 1,1 0,10
             A 9,9 0 1,1 0,-8"
          fill="none"
          stroke="url(#powerGrad)"
          stroke-width="3"
          stroke-linecap="round"
          transform="rotate(180)"/>
    <!-- Vertical line through the gap -->
    <line x1="0" y1="-12" x2="0" y2="-2"
          stroke="#FE2857"
          stroke-width="3"
          stroke-linecap="round"/>
  </g>

  <!-- === TERMINAL PROMPT (developer theme) === -->
  <g transform="translate(26, 100)">
    <!-- Terminal chevron ">" -->
    <polyline points="0,0 5,3 0,6"
              fill="none"
              stroke="#4EC94E"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#softGlow)"/>
    <!-- Underscore cursor -->
    <rect x="8" y="5" width="6" height="1.5" fill="#4EC94E" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- === CONFIG FILE indicator (/tmp/idle) === -->
  <g transform="translate(78, 98)" opacity="0.55">
    <!-- Small file icon -->
    <path d="M 0,0 L 8,0 L 12,4 L 12,12 L 0,12 Z"
          fill="none"
          stroke="#6B9DFC"
          stroke-width="1.3"
          stroke-linejoin="round"/>
    <path d="M 8,0 L 8,4 L 12,4"
          fill="none"
          stroke="#6B9DFC"
          stroke-width="1.3"
          stroke-linejoin="round"/>
    <!-- Integer text inside -->
    <text x="6" y="9"
          font-family="'JetBrains Mono', monospace"
          font-size="5"
          fill="#6B9DFC"
          text-anchor="middle">60</text>
  </g>

  <!-- === ZZZ sleep indicators === -->
  <g fill="#A8C7FA" opacity="0.4" font-family="Arial, sans-serif" font-weight="bold" font-style="italic">
    <text x="60" y="108" font-size="10" filter="url(#softGlow)">z</text>
    <text x="67" y="101" font-size="13" filter="url(#softGlow)">z</text>
    <text x="76" y="93" font-size="16" filter="url(#softGlow)">z</text>
  </g>

  <!-- === "IDLE" label at the bottom === -->
  <text x="64" y="120" text-anchor="middle"
        font-family="'JetBrains Mono', 'SF Mono', 'Consolas', monospace"
        font-size="9" font-weight="600" fill="#6B9DFC" opacity="0.5"
        letter-spacing="3">IDLE SHUTDOWN</text>

  <!-- Warning pulse dot -->
  <circle cx="114" cy="100" r="3" fill="#FF8A00" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>