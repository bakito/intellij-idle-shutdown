<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- IntelliJ-style gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B2D30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E1F22;stop-opacity:1" />
    </linearGradient>
    <!-- Power button gradient -->
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FE2857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC1E43;stop-opacity:1" />
    </linearGradient>
    <!-- Clock ring gradient -->
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B9DFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D6DE0;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background (IntelliJ plugin icon shape) -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="url(#bgGrad)" stroke="#3C3F41" stroke-width="1.5"/>

  <!-- Subtle inner border highlight -->
  <rect x="5" y="5" width="118" height="118" rx="19" ry="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Clock circle (outer ring) -->
  <circle cx="60" cy="62" r="26" fill="none" stroke="url(#clockGrad)" stroke-width="3" opacity="0.9"/>

  <!-- Clock tick marks -->
  <g stroke="#6B9DFC" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="38" x2="60" y2="42"/>
    <line x1="60" y1="82" x2="60" y2="86"/>
    <line x1="36" y1="62" x2="40" y2="62"/>
    <line x1="80" y1="62" x2="84" y2="62"/>
  </g>

  <!-- Clock hands -->
  <g stroke="#A8C7FA" stroke-width="2.2" stroke-linecap="round" fill="none">
    <line x1="60" y1="62" x2="60" y2="48"/>
    <line x1="60" y1="62" x2="73" y2="57"/>
  </g>

  <!-- Center dot -->
  <circle cx="60" cy="62" r="2.2" fill="#A8C7FA"/>

  <!-- Power button symbol - correct IEC 60417-5009 style
       A circle with a gap at the top, and a vertical line passing through the gap -->
  <g transform="translate(92, 32)" filter="url(#glow)">
    <!-- Power circle with gap at top (drawn as an arc from ~35° to ~325°) -->
    <path d="M 0,-8
             A 9,9 0 1,1 0,10
             A 9,9 0 1,1 0,-8"
          fill="none"
          stroke="url(#powerGrad)"
          stroke-width="3"
          stroke-linecap="round"
          transform="rotate(180)"/>
    <!-- Vertical line through the gap -->
    <line x1="0" y1="-12" x2="0" y2="-2"
          stroke="#FE2857"
          stroke-width="3"
          stroke-linecap="round"/>
  </g>

  <!-- ZZZ sleep indicators -->
  <g fill="#A8C7FA" opacity="0.45" font-family="Arial, sans-serif" font-weight="bold" font-style="italic">
    <text x="22" y="100" font-size="12" filter="url(#softGlow)">z</text>
    <text x="30" y="92" font-size="16" filter="url(#softGlow)">z</text>
    <text x="40" y="82" font-size="20" filter="url(#softGlow)">z</text>
  </g>

  <!-- Small "IDLE" text at the bottom -->
  <text x="64" y="114" text-anchor="middle"
        font-family="'JetBrains Mono', 'SF Mono', 'Consolas', monospace"
        font-size="10" font-weight="600" fill="#6B9DFC" opacity="0.6"
        letter-spacing="3">IDLE</text>

  <!-- Warning pulse indicator (small orange dot) -->
  <circle cx="104" cy="100" r="3.5" fill="#FF8A00" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>